# Local stack: MySQL 8 + API.  Usage:
#   cp .env.example .env   (set DB_PASSWORD, MYSQL_ROOT_PASSWORD, JWT_SECRET_KEY, BOOTSTRAP_ADMIN_*)
#   docker compose up --build
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hotel_rooms}
      MYSQL_USER: ${DB_USER:-hotel_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ""
      DB_HOST: db
      DB_PORT: "3306"
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "1802:1802"
    volumes:
      - uploads:/app/uploads

volumes:
  mysql_data:
  uploads:
