services:
  gxp-api:
    build: .
    container_name: gxp-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - path: .env
        required: true
    command: ["uvicorn", "main:app", "--host", "127.0.0.1", "--port", "8107", "--root-path", "/gxp-api", "--proxy-headers", "--forwarded-allow-ips", "127.0.0.1"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8107/health')"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
